
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Countdown Timer</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #6dd5ed, #2193b0);
            color: white;
        }

        nav {
            margin: 20px;
        }

        nav a {
            color: white;
            margin: 10px;
        }

        #countdown {
            background: rgba(0, 0, 0, 0.7);
            padding: 40px 60px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
        }

        #timer {
            font-size: 3rem;
            letter-spacing: 3px;
        }

        .timer-unit {
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 10px;
            display: inline;
        }
    </style>
</head>

<body>
    <header>
        <h2>Peytyn Elkins</h2>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="timer.html">Countdown Timer</a>
    </nav>

    <main>
        <div id="countdown">
            <h2>Countdown to the New Year!</h2>

            <p id="timer">
                <span id="days"></span>
                <span class="timer-unit">Days</span>

                <span id="hours"></span>
                <span class="timer-unit">Hours</span>

                <span id="minutes"></span>
                <span class="timer-unit">Minutes</span>

                <span id="seconds"></span>
                <span class="timer-unit">Seconds</span>
            </p>
        </div>
    </main>

    <footer>
        <p>My Class Website</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
